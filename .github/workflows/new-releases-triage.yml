name: new-releases-triage

on:
  schedule:
    - cron: "30 5 * * *"  # daily 05:30 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "Window for new releases (e.g. 7d, 30d)"
        type: string
        default: "7d"

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Auto-prune old TRIAGE rows
        run: |
          python3 .github/scripts/prune-triage.py \
            --triage TRIAGE.md \
            --max-age-days 60 \
            --pruned-out _archived/triage-pruned-$(date +%F).md

      - name: Fetch release feeds
        id: feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch-release-feeds.py \
            --config .claude/skills/new-releases-triage/sources.yml \
            --since ${{ inputs.since || '7d' }} \
            --output /tmp/candidates.jsonl
          echo "count=$(wc -l < /tmp/candidates.jsonl)" >> "$GITHUB_OUTPUT"

      - name: Dedupe and classify
        if: steps.feeds.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-opus-5
            --max-turns 80
            --allowedTools Read,Edit,Write,Bash,Grep,Glob,Skill
          prompt: |
            You maintain `TRIAGE.md`, the review queue of newly released tools for the owner of `awesome-engineering-research`. A feed fetcher has written today's candidates to `/tmp/candidates.jsonl` (one JSON object per line). Turn them into queue rows the owner can skim in a minute. This runs unattended: decide everything yourself and finish the whole file.

            <procedure>
            1. Read `.claude/skills/new-releases-triage/SKILL.md` for the row shape and the interest areas, then read `TRIAGE.md` as it stands.
            2. For each candidate, skip it if its URL or repo already appears in `INDEX/tools.md`, `_archived/tools.md` or `TRIAGE.md`.
            3. Classify the remaining candidates into one interest area from the skill, using URL, description, topics and language. Drop candidates that match none of the owner's interest areas.
            4. Append one row per surviving candidate to the matching section of `TRIAGE.md`, oldest first, exactly in the row shape from the skill. Create a section only if the skill lists that interest area.
            5. Write `/tmp/triage-summary.md`: one line per interest area with the count added, then a line with the number skipped as duplicates and the number dropped as off-interest.
            </procedure>

            <constraints>
            - Edit only `TRIAGE.md` and `/tmp/triage-summary.md`. Never add rows to `INDEX/`.
            - Keep existing rows untouched; you only append.
            - Do not create branches, commits or pull requests; the workflow does that.
            </constraints>

      - name: Today
        id: today
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Ensure summary exists
        run: test -f /tmp/triage-summary.md || echo "No candidates appended." > /tmp/triage-summary.md

      - name: Open PR if any candidates appended
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: triage/${{ github.run_number }}
          delete-branch: true
          add-paths: |
            TRIAGE.md
            _archived/triage-pruned-*.md
          commit-message: "triage: candidates surveyed ${{ steps.today.outputs.date }}"
          title: "triage: ${{ steps.feeds.outputs.count }} candidates surveyed (${{ steps.today.outputs.date }})"
          body-path: /tmp/triage-summary.md
          labels: triage,automated,agent-authored

      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows,
      # so hand the PR to the review gate explicitly.
      - name: Dispatch auto-review
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-review.yml --repo "$GITHUB_REPOSITORY" --ref master -f pr="${{ steps.pr.outputs.pull-request-number }}"
